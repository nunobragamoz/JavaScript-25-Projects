<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="author" content="Nuno Braga">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Countdown Timer - by Nuno Braga">
    <title>Countdown Timer ⏱️</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">

</head>

<body class="d-flex flex-column min-vh-100">

    <main class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center py-5">

        <h1 class="text-center mb-4">Countdown Timer ⏱️</h1>

        <div class="timer-card card shadow-lg border-0">

            <div class="card-body p-4 p-md-5 text-center">

                <!-- Time to count down from -->
                <div class="row g-3 justify-content-center mb-3">

                    <div class="col-6 col-sm-5">
                        <label for="minutesInput" class="form-label small text-uppercase fw-semibold">Minutes</label>
                        <input type="number" class="form-control form-control-lg text-center" id="minutesInput" placeholder="Minutes" min="0" value="0">
                    </div>

                    <div class="col-6 col-sm-5">
                        <label for="secondsInput" class="form-label small text-uppercase fw-semibold">Seconds</label>
                        <input type="number" class="form-control form-control-lg text-center" id="secondsInput" placeholder="Seconds" min="0" max="59" value="10">
                    </div>

                </div>

                <!-- Big countdown display -->
                <div id="display" class="display-1 fw-bold my-3">00:00</div>

                <!-- Status message -->
                <p id="status" class="status fs-5 mb-4">&nbsp;</p>

                <!-- Controls -->
                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <button id="startBtn" class="btn btn-success btn-lg px-4">Start</button>
                    <button id="pauseBtn" class="btn btn-warning btn-lg px-4">Pause</button>
                    <button id="resetBtn" class="btn btn-outline-secondary btn-lg px-4">Reset</button>
                </div>

            </div>

        </div>

    </main>

    <footer class="text-center py-4">
        Made with ❤️, by Nuno Braga in Lisbon.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>

</body>

</html>
