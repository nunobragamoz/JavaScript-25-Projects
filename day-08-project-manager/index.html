<!DOCTYPE html>
<html lang="pt">

<head>

    <meta name="author" content="Nuno Braga">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestor de Projectos - por Nuno Braga">
    <title>Gestor de Projectos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <header class="app-header">

        <div class="container">

            <h1>Gestor de Projectos</h1>
            <p class="app-subtitle">Organiza os teus projectos e tarefas num só lugar.</p>
        
        </div>

    </header>

    <main class="container pb-5">

        <!-- ============ PROJECTOS ============ -->

        <section class="panel">

            <h2 class="panel-title">Adicionar Projectos & Tarefas</h2>

            <div class="row g-4">

                <div class="col-6">

                    <div class="card form-card h-100">

                        <div class="card-body">

                            <h3 class="card-title">Adicionar Novo Projecto</h3>

                            <div class="mb-3">

                                <label for="nomeProjeto" class="form-label">Nome do Projecto</label>
                                <input type="text" class="form-control" id="nomeProjeto" placeholder="Ex: Website da empresa">
                            
                            </div>

                            <div class="mb-3">

                                <label for="descricaoProjeto" class="form-label">Descrição do Projecto</label>
                                <textarea class="form-control" id="descricaoProjeto" rows="3" placeholder="Breve descrição..."></textarea>
                            
                            </div>


                            <button type="button" class="btn btn-primary w-100" id="adicionarProjetoBtn">＋ Adicionar Projecto</button>

                        </div>

                        

                    </div>


                </div>

                <div class="col-6">

                    <div class="card form-card h-100">

                        <div class="card-body">

                            <h3 class="card-title">Adicionar Nova Tarefa</h3>

                            
                                
                                <label for="projetoAlvo" class="form-label">Projecto Alvo</label>
                                <select id="projetoAlvo" class="form-select"></select>

                                <div class="mb-3">

                                    <label for="tituloTarefa" class="form-label">Título da Tarefa</label>
                                    <input type="text" class="form-control" id="tituloTarefa" placeholder="Ex: Desenhar logótipo" required>
                                
                                </div>

                                <div class="mb-3">

                                    <label for="prioridadeTarefa" class="form-label">Prioridade</label>
                                    <select class="form-select" id="prioridadeTarefa">
                                        <option value="">Selecione uma prioridade</option>
                                        <option value="alta">Alta</option>
                                        <option value="media">Média</option>
                                        <option value="baixa">Baixa</option>
                                    </select>
                                
                                </div>

                                <button type="button" class="btn btn-primary w-100" id="adicionarTarefaBtn">＋ Adicionar Tarefa</button>
                            
                            

                        </div>

                    </div>

                </div>

                <div class="col-12">

                    <div class="card list-card h-100">

                        <div class="card-body">

                            <h3 class="card-title">Lista de Projectos & Tarefas</h3>

                            <ul id="listarProjetos" class="list-group list-group-flush">
                                <li class="list-group-item empty-state">Ainda não há projectos. Adiciona um primeiro.</li>
                            </ul>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <!-- ============ TAREFAS ============ -->

    </main>

    <footer class="text-center py-4">
        Feito com ❤️, por Nuno Braga em Lisboa.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>

</body>

</html>
