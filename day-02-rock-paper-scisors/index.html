<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="author" content="Nuno Braga">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rock, Paper Scissors - by Nuno Braga">
    <title>Rock, Paper Scissors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container mt-4">

        <h1 class="text-center mb-5ß">Rock, Paper, Scissors</h1>

        <p id="scoreDisplay" class="text-center mb-5">Player Score: 0 | Computer Score: 0</p>

        

        <div class="container text-center mb-5">

            <div class="row">

                <div class="text-center mb-5 col-6">
                    
                    Player's Choice: <span id="playerChoice">None</span>
                
                </div>

                <div class="text-center mb-5 col-6">
                    
                    Computer's Choice: <span id="computerChoice">None</span>

                </div>

            </div>

            <p id="resultText" class="mb-5"></p>

            <p class="text-center mb-4">Make your choice:</p>

            <div class="row">

                <div class="col">
                    <button id="rockBtn" class="btn btn-primary">Rock</button>
                </div>

                <div class="col">
                    <button id="paperBtn" class="btn btn-primary">Paper</button>
                </div>

                <div class="col">
                    <button id="scissorsBtn" class="btn btn-primary">Scissors</button>
                </div>

            </div>

            <button id="resetBtn" class="btn btn-danger mt-4">Reset Game</button>


        </div>

        

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>


    
</body>

</html>
