<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="author" content="Nuno Braga">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lucky Number Machine - by Nuno Braga">
    <title>Lucky Number Machine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<body>

    <main>

        <div class="container mt-5">

            <h1 class="text-center mb-4">Lucky Number Machine</h1>

            <div id="numberDisplay" class="text-center mb-4">
                <span id="luckyNumber" class="display-1">?</span>
            </div>

            <p id="status" class="text-center mb-2"></p>
            
            <button id="generateBtn" class="btn btn-primary btn-lg d-block mx-auto">Generate Lucky Number</button>

            <ul id="history" class="list-group mt-4"></ul>

        </div>

    </main>
