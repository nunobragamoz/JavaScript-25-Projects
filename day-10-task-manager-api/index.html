<!DOCTYPE html>
<html lang="pt">

<head>

    <meta name="author" content="Nuno Braga">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="API de Gestão de Tarefas - por Nuno Braga">
    <title>API de Gestão de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    

</head>

<body>

    <header class="bg-dark text-white p-3 mb-4">
        <div class="container">
            <h1 class="mb-0">API de Gestão de Tarefas</h1>
        </div>
    </header>

    <main class="container">

        <section id="task-form-section" class="mb-4">

            <h2>Adicionar Nova Tarefa</h2>

            <form id="task-form">

                <div class="mb-3">
                    <label for="task-title" class="form-label">Título</label>
                    <input type="text" class="form-control" id="novaTarefa">
                </div>

                

                <button type="button" class="btn btn-primary" id="adicionarBtn">Adicionar Tarefa</button>

            </form>

        </section>

        <section id="tasks-section">

            <h2>Tarefas</h2>
            <ul id="listaTarefas" class="list-group">
                <!-- Tasks will be dynamically added here -->
            </ul>

        </section>

    </main>

    <footer class="bg-dark text-white p-3 mt-4">

        <div class="container text-center">
            &copy; 2026 Nuno Braga. All rights reservados.
        </div>

    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>

</body>

</html>
