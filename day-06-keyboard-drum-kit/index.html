<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="author" content="Nuno Braga">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Keyboard Drum Kit - by Nuno Braga">
  <title>Keyboard Drum Kit 🥁 v1.1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css?family=Arvo" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <main class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center text-center py-5">

    <h1 id="title" class="mb-3">Drum Kit 🥁 Machine v1.1</h1>

    <p class="lead text-light mb-5">Press <strong>W A S D</strong> or <strong>J K L</strong>, or tap a pad to play.</p>

    <div class="drumSet d-flex flex-wrap justify-content-center gap-3">

      <button class="w drum">w</button>
      <button class="a drum">a</button>
      <button class="s drum">s</button>
      <button class="d drum">d</button>
      <button class="j drum">j</button>
      <button class="k drum">k</button>
      <button class="l drum">l</button>

    </div>

  </main>

  <footer class="text-center py-4">

    Made with ❤️, by Nuno Braga in Lisbon.

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="script.js" defer></script>

</body>

</html>
