<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="author" content="Nuno Braga">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book Wishlist - by Nuno Braga">
    <title>Book Wishlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    

</head>

<body>

    <div class="container">

        <h1 class="text-center mb-4">Book Wishlist</h1>

        <div class="col-md-6 offset-md-3">

            <input type="text" class="form-control mb-3" id="bookInput" placeholder="Enter book title">
            <button class="btn btn-primary" id="addBtn">Add Book</button>

        </div>

        <div class="col-md-6 offset-md-3 mt-4">

            <ul class="list-group" id="wishlist"></ul>
        

            <p class="text-center mb-4" id="counter">Books: 0</p>

        </div>

        <div class="row col-md-6 offset-md-3 mt-4">

            <button class="btn btn-danger" id="clearBtn">Clear</button>
            <button class="btn btn-success" id="sortBtn">Sort</button>

        </div>

    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>

</body>

</html>
