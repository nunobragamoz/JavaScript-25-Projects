<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="author" content="Nuno Braga">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Report Card - by Nuno Braga">
    <title>Report Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">


</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-4">Student Report Card 📚</h1>

        
        <!-- Add a new student with their first grade -->

        <div class="row g-2 justify-content-center mb-3">

            <div class="col-12 col-md-4">
                <input type="text" class="form-control" id="nameInput" placeholder="Student name">
            </div>

            <div class="col-12 col-md-4">
                <input type="number" class="form-control" id="gradeInput" placeholder="First grade (0–20)" min="0" max="20">
            </div>

            <div class="col-12 col-md-auto d-grid">
                <button class="btn btn-primary" id="addStudentBtn">Add student</button>
            </div>

        </div>


        <!-- Class-wide summary -->

        <p class="text-center text-muted mb-4" id="classSummary">No students yet</p>


        <!-- Add a grade to an existing student -->

        <div class="row g-2 justify-content-center mb-4">

            <div class="col-12 col-md-4">
                <input type="text" class="form-control" id="targetName" placeholder="Existing student name">
            </div>

            <div class="col-12 col-md-4">
                <input type="number" class="form-control" id="newGradeInput" placeholder="New grade" min="0" max="20">
            </div>

            <div class="col-12 col-md-auto d-grid">
                <button class="btn btn-success" id="addGradeBtn">Add grade</button>
            </div>

        </div>


        <!-- Rendered student cards go here -->

        <div class="row g-3" id="studentList"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>

</body>

</html>
